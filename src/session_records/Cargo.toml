[package]
name = "splat-session-records"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
test-support = ["splat-content-ui/test-support"]

[dependencies]
splat-campaign = { path = "../../crates/campaign" }
splat-content = { path = "../../crates/content" }
splat-content-ui = { path = "../content_ui" }
splat-design = { path = "../design" }
splat-execution = { path = "../../crates/execution" }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
splat-content-ui = { path = "../content_ui", features = ["test-support"] }
