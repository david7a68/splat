[package]
name = "splat-world-page"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
splat-character = { path = "../../crates/character" }
splat-content = { path = "../../crates/content" }
splat-content-ui = { path = "../content_ui" }
splat-design = { path = "../design" }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
splat-trackers = { path = "../trackers", features = ["test-support"] }
splat-content-ui = { path = "../content_ui", features = ["test-support"] }
# The trackers' test reader (`trackers/reader.rs`) still draws with egui.
tempfile = "3"
