[package]
name = "splat-design"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
test-support = ["dep:egui_kittest"]

[dependencies]
egui = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts"] }
egui-phosphor = "0.11"
splat-assets = { path = "../../crates/assets" }
splat-campaign = { path = "../../crates/campaign" }
unicode-segmentation = "1.13"
url = "2.5"
# Test builds only (`test-support`): the themed harness builders (`design::test_harness`).
egui_kittest = { version = "0.33", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# The quiet-text harness reads the parts' test counters.
splat-design = { path = ".", features = ["test-support"] }
egui_extras = { version = "0.33", default-features = false, features = ["file", "image"] }
egui_kittest = { version = "0.33", features = ["wgpu"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde_json = "1"
syn = { version = "2.0.119", features = ["full", "visit", "extra-traits"] }
tempfile = "3"
# Model tests (ruling M29): a state machine model as the oracle of a shared part. The gate runs
# them with a fixed seed and case count. No `fork` or `timeout` feature: no child process, no clock.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
proptest-state-machine = "0.3"
