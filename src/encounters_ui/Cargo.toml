[package]
name = "splat-encounters-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
test-support = ["splat-session-records/test-support", "splat-party/test-support", "splat-content-ui/test-support"]

[dependencies]
splat-party = { path = "../party_support" }
splat-session-records = { path = "../session_records" }
splat-campaign = { path = "../../crates/campaign" }
splat-character = { path = "../../crates/character" }
splat-content = { path = "../../crates/content" }
splat-content-ui = { path = "../content_ui" }
splat-design = { path = "../design" }
splat-execution = { path = "../../crates/execution" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
serde_yaml_ng = "0.10"


[dev-dependencies]
splat-session-records = { path = "../session_records", features = ["test-support"] }
splat-party = { path = "../party_support", features = ["test-support"] }
splat-content-ui = { path = "../content_ui", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
