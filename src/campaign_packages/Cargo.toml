[package]
name = "splat-campaign-packages"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
splat-character = { path = "../../crates/character" }
splat-content = { path = "../../crates/content" }
splat-content-ui = { path = "../content_ui" }
splat-design = { path = "../design" }
eframe = { version = "0.33", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
serde_yaml_ng = "0.10"
tempfile = "3"

[features]
test-support = ["splat-content-ui/test-support"]

[dev-dependencies]
splat-content-ui = { path = "../content_ui", features = ["test-support"] }
