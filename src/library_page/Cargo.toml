[package]
name = "splat-library-page"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
test-support = ["splat-content-ui/test-support"]

[dependencies]
splat-campaign = { path = "../../crates/campaign" }
splat-character = { path = "../../crates/character" }
splat-content = { path = "../../crates/content" }
splat-execution = { path = "../../crates/execution" }
splat-content-ui = { path = "../content_ui" }
splat-design = { path = "../design" }
eframe = { version = "0.33", default-features = false }
serde_yaml_ng = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
rfd = "0.15"

[dev-dependencies]
serde_json = "1"
splat-content-ui = { path = "../content_ui", features = ["test-support"] }
