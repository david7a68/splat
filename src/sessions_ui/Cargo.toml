[package]
name = "splat-sessions-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
test-support = ["splat-session-records/test-support", "splat-content-ui/test-support"]

[dependencies]
splat-campaign = { path = "../../crates/campaign" }
splat-character = { path = "../../crates/character" }
splat-content = { path = "../../crates/content" }
splat-content-ui = { path = "../content_ui" }
splat-design = { path = "../design" }
splat-session-records = { path = "../session_records" }
splat-execution = { path = "../../crates/execution" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
serde_yaml_ng = "0.10"
sha2 = "0.10"
directories = "6"
zeroize = "1"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"

pulldown-cmark = "0.13"

[dev-dependencies]
splat-session-records = { path = "../session_records", features = ["test-support"] }
splat-content-ui = { path = "../content_ui", features = ["test-support"] }
splat-encounters-ui = { path = "../encounters_ui", features = ["test-support"] }
