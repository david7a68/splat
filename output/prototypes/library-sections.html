<!-- Throwaway design study: three library layouts. Representative entries only. -->
<div id="splat-library-study" aria-label="Library layout study">
  <style>
    #splat-library-study { --s-bg:light-dark(#fafafa,#1c1d1e); --s-pane:light-dark(#f0f1f2,#232527); --s-text:light-dark(#202529,#edf0f2); --s-muted:light-dark(#57616a,#aeb8c0); --s-line:light-dark(#d1d6da,#41474b); --s-active:light-dark(#d6edf7,#11465e); --s-accent:light-dark(#005d83,#8dd8f7); color:var(--s-text); font:14px/1.5 system-ui,sans-serif; }
    #splat-library-study * { box-sizing:border-box; }
    #splat-library-study .window { background:var(--s-bg); border:1px solid var(--s-line); border-radius:8px; overflow:hidden; }
    #splat-library-study .titlebar { padding:9px 16px; background:var(--s-pane); display:flex; justify-content:space-between; gap:12px; }
    #splat-library-study .shell { display:grid; grid-template-columns:110px minmax(0,1fr); }
    #splat-library-study .global { padding:20px 12px; border-right:1px solid var(--s-line); }
    #splat-library-study .global div { padding:7px 8px; margin-bottom:7px; }
    #splat-library-study .selected { background:var(--s-active); border-radius:4px; }
    #splat-library-study header { padding:20px; border-bottom:1px solid var(--s-line); }
    #splat-library-study h1 { font-size:24px; font-weight:500; margin:0; }
    #splat-library-study h2 { font-size:22px; font-weight:500; margin:9px 0; }
    #splat-library-study h3 { font-size:15px; font-weight:500; margin:22px 0 8px; }
    #splat-library-study .muted { color:var(--s-muted); }
    #splat-library-study .small { font-size:12px; }
    #splat-library-study .headrow { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
    #splat-library-study .search { margin-top:15px; display:flex; gap:8px; align-items:center; }
    #splat-library-study input { width:100%; min-width:0; padding:9px 12px; color:var(--s-text); background:var(--s-pane); border:1px solid var(--s-line); border-radius:4px; font:inherit; }
    #splat-library-study button { font:inherit; color:var(--s-text); cursor:pointer; border:1px solid var(--s-line); background:var(--s-pane); padding:7px 10px; border-radius:4px; text-align:left; }
    #splat-library-study button:hover { background:var(--s-active); }
    #splat-library-study button[aria-pressed=true] { background:var(--s-active); color:var(--s-accent); }
    #splat-library-study .workspace { display:grid; grid-template-columns:155px minmax(0,1fr); }
    #splat-library-study .categories { padding:16px 10px; border-right:1px solid var(--s-line); }
    #splat-library-study .categories button { display:block; width:100%; background:transparent; border:0; margin-bottom:3px; }
    #splat-library-study .categories button[aria-pressed=true] { background:var(--s-active); }
    #splat-library-study .grouplabel { font-size:12px; color:var(--s-muted); margin:15px 10px 5px; }
    #splat-library-study .grouplabel:first-child { margin-top:0; }
    #splat-library-study .content { display:grid; grid-template-columns:minmax(160px,0.72fr) minmax(0,1.4fr); }
    #splat-library-study .results { padding:16px 12px; border-right:1px solid var(--s-line); }
    #splat-library-study .result { display:block; width:100%; margin-top:6px; background:transparent; border:0; }
    #splat-library-study .result span { display:block; color:var(--s-muted); font-size:12px; }
    #splat-library-study .reader { padding:20px 24px 32px; min-height:440px; min-width:0; }
    #splat-library-study .reader p { margin:10px 0; }
    #splat-library-study .tag { display:inline-block; padding:2px 7px; background:var(--s-pane); border-radius:4px; font-size:12px; }
    #splat-library-study .reading { padding-bottom:16px; }
    #splat-library-study details { border-top:1px solid var(--s-line); padding:12px 0; }
    #splat-library-study summary { cursor:pointer; font-weight:500; }
    #splat-library-study code { font-size:12px; overflow-wrap:anywhere; }
    #splat-library-study dl { display:grid; grid-template-columns:100px minmax(0,1fr); gap:8px; }
    #splat-library-study dt { color:var(--s-muted); }
    #splat-library-study dd { margin:0; overflow-wrap:anywhere; }
    #splat-library-study footer { border-top:1px solid var(--s-line); padding:9px 16px; color:var(--s-muted); font-size:12px; }
    #splat-library-study .tabs .workspace { display:block; }
    #splat-library-study .tabs .categories { border-right:0; border-bottom:1px solid var(--s-line); display:flex; gap:5px; flex-wrap:wrap; padding:12px 20px; }
    #splat-library-study .tabs .categories button { width:auto; margin:0; }
    #splat-library-study .tabs .grouplabel { display:none; }
    #splat-library-study .index .workspace { display:block; }
    #splat-library-study .index .categories { display:none; }
    #splat-library-study .index .content { grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); }
    #splat-library-study .index .results { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; align-content:start; }
    #splat-library-study .index .resultcount { grid-column:1/-1; }
    #splat-library-study .index .result { padding:5px; }
    @media(max-width:800px) { #splat-library-study .shell { grid-template-columns:1fr; } #splat-library-study .global { display:flex; gap:10px; padding:8px 12px; border-right:0; border-bottom:1px solid var(--s-line); } #splat-library-study .global div { margin:0; } }
    @media(max-width:590px) { #splat-library-study .workspace { display:block; } #splat-library-study .categories { display:flex; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--s-line); } #splat-library-study .categories button { width:auto; } #splat-library-study .grouplabel { width:100%; } #splat-library-study .content,#splat-library-study .index .content { display:block; } #splat-library-study .results { border-right:0; border-bottom:1px solid var(--s-line); } #splat-library-study .reader { min-height:0; padding:18px; } }
    @media(pointer:coarse) { #splat-library-study button,#splat-library-study summary { min-height:44px; } #splat-library-study input { font-size:16px; } }
  </style>
  <div class="window tree">
    <div class="titlebar"><span>Splat</span><span class="small muted">Library design study · sample entries</span></div>
    <div class="shell">
      <aside class="global" aria-label="Workspace"><div class="selected">Library</div><div class="muted">Campaign</div></aside>
      <main>
        <header>
          <div class="headrow"><h1>Library</h1><span class="muted">D&D 2024 · SRD 5.2.1 <span class="tag">Read only</span></span></div>
          <div class="search"><label for="splat-library-query">Search</label><input id="splat-library-query" type="search" placeholder="Search all sections…"></div>
        </header>
        <div class="workspace"><nav class="categories" aria-label="Library sections"></nav><div class="content"><section class="results" aria-label="Entries"></section><article class="reader" aria-label="Selected entry"></article></div></div>
      </main>
    </div>
    <footer aria-live="polite"></footer>
  </div>
  <script>
    (() => {
      const root = document.getElementById('splat-library-study');
      const state = { layout:'tree', section:'Rules', selected:0, query:'' };
      const groups = [['Game content',['Creatures','Spells','Items']],['Characters',['Character options']],['Game rules',['Rules','Glossary']],['Preparation',['Encounters']]];
      const entries = [
        {name:'Ability Check',section:'Rules',type:'Rule definition',context:'D20 Tests',body:'Use an ability check to resolve a challenge that calls for one of the six abilities. A related skill can also apply.',note:'Illustrative overview; the exact rule remains in the definition.',support:'Engine support incomplete',technical:true},
        {name:'Ability Checks',section:'Rules',type:'Reference text',context:'Playing the Game',body:'The rulebook explanation of ability checks, with the surrounding D20 Test rules.',note:'Read the chapter for the full rule.'},
        {name:'Ability Modifier',section:'Rules',type:'Rule definition',context:'Abilities',body:'The modifier associated with an ability score.'},
        {name:'Ability Check',section:'Glossary',type:'Reference text',context:'Glossary · page 176',body:'An ability check is a D20 Test that represents using one of the six abilities—or a specific skill associated with an ability—to overcome a challenge.',note:'See also: Playing the Game → D20 Tests and Proficiency.'},
        {name:'Goblin Warrior',section:'Creatures',type:'Creature reference',context:'SRD 5.2.1',body:'Creature entries open with their stat block, followed by traits and actions.'},
        {name:'Goblin Boss',section:'Creatures',type:'Creature reference',context:'SRD 5.2.1',body:'Creature entries open with their stat block, followed by traits and actions.'},
        {name:'Bless',section:'Spells',type:'Spell reference',context:'SRD 5.2.1',body:'Spell entries open with level, casting time, range, and duration, followed by the spell description.'},
        {name:'Longsword',section:'Items',type:'Item reference',context:'Equipment',body:'Item entries open with their properties, followed by their description.'},
        {name:'Choose Abilities',section:'Character options',type:'Reference text',context:'Character creation',body:'Character creation steps sit together, in their intended order.'}
      ];
      const esc = s => s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      function item(e) { const i=entries.indexOf(e); return `<button class="result" data-entry="${i}" aria-pressed="${i===state.selected}">${esc(e.name)}<span>${esc(e.type)} · ${esc(e.context)}</span></button>`; }
      function results() {
        const query=state.query.toLowerCase();
        const found=entries.filter(e=>query ? `${e.name} ${e.context} ${e.section}`.toLowerCase().includes(query) : state.layout==='index'||e.section===state.section);
        const count=`<div class="small muted resultcount">${query?'All sections':state.layout==='index'?'Browse by section':state.section} · ${found.length} sample entries</div>`;
        root.querySelector('.results').innerHTML=count+(state.layout==='index'?groups.flatMap(g=>g[1]).map(s=>{const rows=found.filter(e=>e.section===s);return rows.length?`<section><h3>${s}</h3>${rows.map(item).join('')}</section>`:'';}).join(''):found.map(item).join(''))+(found.length?'':'<p class="muted">No sample entries in this section.</p>');
      }
      function reader() {
        const e=entries[state.selected];
        root.querySelector('.reader').innerHTML=`<div class="small muted">${e.section} / ${e.context}</div><h2>${e.name}</h2><div class="headrow"><span class="tag">${e.type}</span><span class="small muted">${e.support||'Reference preview'}</span></div><section class="reading"><h3>Overview</h3><p>${e.body}</p>${e.note?`<p class="small muted">${e.note}</p>`:''}</section>${e.technical?'<details><summary>Rule details</summary><dl><dt>Test</dt><dd>Ability check</dd><dt>Abilities</dt><dd>Strength, Dexterity, Constitution, Intelligence, Wisdom, Charisma</dd><dt>Skill</dt><dd>Optional</dd><dt>Base rule</dt><dd>D20 Test</dd></dl></details><details><summary>Engine support</summary><p>Rules specified. Engine support is incomplete.</p></details>':''}<details><summary>Source and identifiers</summary><p class="small">SRD 5.2.1 · Built-in package · Read only</p>${e.technical?'<code>definitions/glossary/ability_check.md</code><p><code>dnd2024:glossary/ability_check</code></p>':''}</details>`;
      }
      function render() {
        root.querySelector('.window').className='window '+state.layout;
        root.querySelector('.categories').innerHTML=groups.map(([label,sections])=>`<div class="grouplabel">${label}</div>`+sections.map(s=>`<button data-section="${s}" aria-pressed="${!state.query&&s===state.section}">${s}</button>`).join('')).join('');
        results();reader();
        const names={tree:'A · Section sidebar',tabs:'B · Section tabs',index:'C · Grouped index'};
        root.querySelector('footer').textContent=`${names[state.layout]} · ${state.query?'Search all sections':state.section} · ${entries[state.selected].name}`;
      }
      root.addEventListener('click',event=>{
        const b=event.target.closest('button');if(!b)return;
        if(b.dataset.section){state.section=b.dataset.section;state.query='';root.querySelector('input').value='';const first=entries.findIndex(e=>e.section===state.section);if(first>=0)state.selected=first;}
        if(b.dataset.entry!==undefined)state.selected=Number(b.dataset.entry);
        render();
      });
      root.querySelector('input').addEventListener('input',event=>{state.query=event.target.value;results();});
      render();
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(state,'layout',{label:'Library layout',options:[{label:'A · Section sidebar',value:'tree'},{label:'B · Section tabs',value:'tabs'},{label:'C · Grouped index',value:'index'}]});}
    })();
  </script>
</div>
