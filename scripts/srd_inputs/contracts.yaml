# Reviewed against the bundled SRD 5.2.1. These contracts require future adapters.
# Parameter names are a closed contract, not scripts or expressions to evaluate.
dnd2024:spells/counterspell:
  source_sha256: 3dcf6fba5eba512f4e3352846610f6615314c4d5b8d1da50c2174128aa7712bc
  requires: [dnd2024:counterspell_2024]
  fields:
    splat_actions:
      cast:
        name: Cast Counterspell
        activation:
          economy: reaction
          category: magic
          timing: dnd2024:spell.cast_pending
          cost_at: dnd2024:spell_slot_expenditure
        targets:
          caster:
            kind: creature
            count: {min: 1, max: 1}
            range: {feet: 60}
            visible: true
        steps:
          - key: interrupt
            operation: dnd2024:counterspell_2024
            target: caster
            parameters:
              triggering_components_any: [verbal, somatic, material]
              save_ability: constitution
              save_dc: {binding: save_dc}
              failure:
                spell_effect: dissipate
                casting_economy: wasted
                spell_slot: not_expended
              success: continue_cast
              bind_to: event.use
              other_costs: follow_own_rule
    splat_parameters:
      save_dc: {type: integer, minimum: 1, maximum: 40, required: true}

dnd2024:spells/polymorph:
  source_sha256: d0c3d384bcc1e844742cd8ffd30775fd372883e229ec795897fd7147971e8c80
  requires: [dnd2024:polymorph_2024]
  fields:
    splat_actions:
      cast:
        name: Cast Polymorph
        activation: {economy: action, category: magic, timing: on_turn, cost_at: dnd2024:spell_slot_expenditure}
        targets:
          chosen:
            kind: creature
            count: {min: 1, max: 1}
            range: {feet: 60}
            visible: true
        steps:
          - key: transform
            operation: dnd2024:polymorph_2024
            target: chosen
            parameters:
              save_ability: wisdom
              save_dc: {binding: save_dc}
              on_success: no_effect
              form_type: beast
              form_chooser: caster
              form_cr_max: target_cr_else_level
              retained: [alignment, personality, creature_type, hit_points, hit_dice]
              replaced: remaining_game_statistics
              temporary_hp: form_hit_points
              end_early: target_has_no_temporary_hp
              remove_remaining_temporary_hp_on_end: true
              concentration: caster
              maximum_duration: {value: 1, unit: hour}
              action_limit: form_anatomy
              prohibited: [speak, cast_spells]
              equipment: meld_and_suppress_all_benefits
    splat_parameters:
      save_dc: {type: integer, minimum: 1, maximum: 40, required: true}

dnd2024:creatures/hydra:
  source_sha256: 429a5a604b7cc4f1f75e4669efbb7d30052e3ec08d28a83e10c8154b92c1e5c1
  requires: [dnd2024:hydra_heads_2024, dnd2024:hold_breath]
  fields:
    splat_traits:
      condition_immunities:
        rule: dnd2024:condition_immunities
        parameters: {conditions: [blinded, charmed, deafened, frightened, stunned, unconscious]}
      hold_breath:
        rule: dnd2024:hold_breath
        parameters: {duration: {value: 1, unit: hour}}
      heads:
        rule: dnd2024:hydra_heads_2024
        parameters:
          initial_heads: 5
          damage_threshold_per_turn: 25
          heads_lost_on_threshold: 1
          death_when_heads: 0
          regrow_at: owner_turn_end
          regrow_per_lost_head: 2
          lost_head_window: since_last_owner_turn
          regrowth_requires_living_head: true
          regrowth_prevented_by: fire_damage_since_last_owner_turn
          healing_per_regrowth_event: 20
          extra_reactions_per_head_beyond_first: 1
          extra_reactions_allowed: opportunity_attack
          extra_reactions_refresh: owner_turn_start
          # User's ruling: head-count changes affect the next refresh.
          reaction_capacity_recomputed_at: owner_turn_start
    splat_actions:
      bite:
        name: Bite
        activation: {economy: action, category: attack, timing: on_turn, cost_at: commit}
        targets:
          chosen: {kind: creature, count: {min: 1, max: 1}, allow_self: false, range: {feet: 10}}
        rolls:
          attack: {expression: 1d20, modifier: 8, scope: attack}
          damage: {expression: '1d10 + 5', scope: attack}
        steps:
          - key: attack
            operation: dnd2024:attack
            kind: melee_weapon
            target: chosen
            roll: attack
            on_hit: {damage: [{type: piercing, amount: {roll: damage}}]}
      multiattack:
        name: Multiattack
        activation: {economy: action, category: attack, timing: on_turn, cost_at: commit}
        steps:
          - key: heads
            operation: dnd2024:hydra_heads_2024
            parameters:
              mode: multiattack
              attack: bite
              count: living_heads
              pay_attack_economy_again: false

dnd2024:items/bag_of_holding:
  source_sha256: 25ef09fc35897277d100419c0d05a7fb2732b35b211e2eed5c3a9be23ec65b35
  requires: [dnd2024:bag_of_holding_2024]
  fields:
    splat_item:
      category: wondrous_item
      rarity: uncommon
      mass: {value: 5, unit: lb}
      stackable: false
      equipment: {allowed: [carried], attunement: none}
      containment:
        capacity:
          mass: {value: 500, unit: lb}
          volume: {value: 64, unit: ft3}
        carried_mass: {value: 5, unit: lb}
    splat_traits:
      extradimensional_container:
        rule: dnd2024:bag_of_holding_2024
        parameters:
          approximate_interior_feet: [2, 2, 4]
          retrieve_action: utilize
          destroy_on: [overloaded, pierced, torn]
          destroyed_contents_destination: scattered_astral_plane
          invert: spill_contents_unharmed
          restore_before_reuse: true
          air_minutes: 10
          divide_air_by: breathing_creatures_inside
          nested_extradimensional_space:
            examples: [handy_haversack, portable_hole]
            similar_spaces: explicit_assumption
            destroys: both_items
            gate_origin: insertion_location
            sphere_radius_feet: 10
            affected: all_creatures_in_sphere
            destination: random_astral_plane_location
            gate: one_way_closes_cannot_reopen

dnd2024:items/wand_of_fireballs:
  source_sha256: ba840373a3f3bee48d32b7dd6bebd68e575707d70ca26981706b3120f63c522a
  requires: [dnd2024:wand_of_fireballs_2024]
  fields:
    splat_item:
      category: wand
      rarity: rare
      stackable: false
      equipment: {allowed: [carried, wielded], attunement: required, attunement_requirement: spellcaster}
    splat_resources:
      charges:
        name: Charges
        max: 7
        initial: 7
        recovery:
          - key: dawn
            mechanic: dnd2024:dawn
            subject: owner
            roll: {key: recovery, expression: '1d6 + 1', scope: use}
            restore: {add: {roll: recovery}}
    splat_actions:
      cast:
        name: Cast Fireball
        activation: {economy: action, category: magic, timing: on_turn, cost_at: commit}
        steps:
          - key: cast
            operation: dnd2024:wand_of_fireballs_2024
            spell: {key: dnd2024:spells/fireball}
            parameters:
              requires: [held, attuned]
              charges_min: 1
              charges_max: 3
              base_spell_level: 3
              level_per_extra_charge: 1
              save_dc: 15
              spell_slot_cost: 0
              last_charge:
                roll: 1d20
                destroy_on: [1]
                destroyed_form: ashes
