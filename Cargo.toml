[package]
name = "splat"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
default-run = "splat"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
zeroize = "1"
directories = "6"
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
serde_yaml_ng = "0.10"
include_dir = "0.7"
sha2 = "0.10"
pulldown-cmark = "0.13"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
base64 = "0.22"
rfd = "0.15"
rayon = "1.11"
egui-phosphor = "0.11"
libc = "0.2"
egui_extras = { version = "0.33", default-features = false, features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["wgpu", "eframe"] }
ab_glyph = "0.2"
epaint_default_fonts = "0.33"

# Dependencies only: the app's own code stays debuggable. Parsing, hashing and painting all
# run in dependencies, and they are most of the time the tests take.
[profile.dev.package."*"]
opt-level = 2

# Keep file/line backtraces in tests without generating local-variable debug info.
# Normal `cargo build` / `cargo run` still provide full app debugging information.
[profile.test.package.splat]
debug = "line-tables-only"
