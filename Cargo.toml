[package]
name = "splat"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
default-run = "splat"

[workspace]
members = [
    "crates/*",
    "src/campaign_packages",
    "src/content_ui",
    "src/design",
    "src/encounters_ui",
    "src/library_page",
    "src/session_records",
    "src/party_support",
    "src/party_page",
    "src/sessions_ui",
    "src/trackers",
    "src/world_page",
]
default-members = [
    ".",
    "crates/*",
    "src/campaign_packages",
    "src/content_ui",
    "src/design",
    "src/encounters_ui",
    "src/library_page",
    "src/session_records",
    "src/party_support",
    "src/party_page",
    "src/sessions_ui",
    "src/trackers",
    "src/world_page",
]
resolver = "3"

[dependencies]
splat-party = { path = "src/party_support" }
splat-party-page = { path = "src/party_page" }
splat-library-page = { path = "src/library_page" }
splat-campaign-packages = { path = "src/campaign_packages" }
splat-world-page = { path = "src/world_page" }
splat-sessions-ui = { path = "src/sessions_ui" }
splat-encounters-ui = { path = "src/encounters_ui" }
splat-content-ui = { path = "src/content_ui" }
splat-assets = { path = "crates/assets" }
splat-campaign = { path = "crates/campaign" }
splat-character = { path = "crates/character" }
splat-content = { path = "crates/content" }
splat-design = { path = "src/design" }
splat-execution = { path = "crates/execution" }
splat-trackers = { path = "src/trackers" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
zeroize = "1"
directories = "6"
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
pulldown-cmark = "0.13"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
base64 = "0.22"
rfd = "0.15"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# `file:` URLs by the platform's rules (`design::outcome::file_url`).
url = "2.5"
# Graphemes: a fact line breaks a long word only between whole characters (design::fact).
unicode-segmentation = "1.13"
# The GPUI UI (`src/gui/`, docs/development.md). gpui-component wraps the hard widgets; pages use
# only `gui::kit`.
gpui = { package = "gpui-pre", version = "0.3.14" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.14", features = ["wayland", "x11"] }
gpui-component = "0.11"
# Its base layer owns the scroll bars' paint; `gui::theme::install` sets their width there.
gpui-base = "0.11"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.14", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.14", features = ["wayland", "x11", "test-support"] }
# The screenshot harness's text system: only Splat's own fonts, so captures do not depend on the
# machine's fonts (`gui::harness`).
gpui_wgpu = { package = "gpui-pre-wgpu", version = "0.3.14", features = ["test-support"] }
splat-library-page = { path = "src/library_page", features = ["test-support"] }
splat-campaign-packages = { path = "src/campaign_packages", features = ["test-support"] }
splat-sessions-ui = { path = "src/sessions_ui", features = ["test-support"] }
splat-encounters-ui = { path = "src/encounters_ui", features = ["test-support"] }
splat-content-ui = { path = "src/content_ui", features = ["test-support"] }
rayon = "1.11"
splat-campaign = { path = "crates/campaign", features = ["test-support"] }
splat-content = { path = "crates/content", features = ["test-support"] }
splat-design = { path = "src/design", features = ["test-support"] }
splat-trackers = { path = "src/trackers", features = ["test-support"] }
# The source checks read Rust with a real parser (`design::attributes`), never by hand.
syn = { version = "2.0.119", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
# Model tests of a page against a shared part's state machine model (ruling M29; see
# `src/design/Cargo.toml`).
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
proptest-state-machine = "0.3"

# Test builds only. jemalloc returns freed memory and scales across the visual
# suite's workers; it does not build with MSVC.
[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemallocator = "0.7.0"

# Keep clean project builds small; preserve dependency runtime performance.
[profile.dev]
debug = "line-tables-only"
codegen-units = 16
incremental = false

[profile.dev.package."*"]
opt-level = 2

# Tests only: `cargo build` and `cargo run` keep the app's own code unoptimized for
# debugging. The visual suite runs the app's frames and content work thousands of
# times, and optimized code cut its CPU time by more than half.
[profile.test.package.splat]
opt-level = 2

[profile.test.package.splat-campaign]
opt-level = 2

[profile.test.package.splat-character]
opt-level = 2

[profile.test.package.splat-content]
opt-level = 2

[profile.test.package.splat-design]
opt-level = 2

[profile.test.package.splat-execution]
opt-level = 2

[profile.test.package.splat-trackers]
opt-level = 2

[profile.test.package.splat-content-ui]
opt-level = 2

[profile.test.package.splat-encounters-ui]
opt-level = 2

[profile.test.package.splat-session-records]
opt-level = 2

[profile.test.package.splat-party]
opt-level = 2

[profile.test.package.splat-party-page]
opt-level = 2

[profile.test.package.splat-sessions-ui]
opt-level = 2

[profile.test.package.splat-world-page]
opt-level = 2

[profile.test.package.splat-campaign-packages]
opt-level = 2

[profile.test.package.splat-library-page]
opt-level = 2
