[package]
name = "splat"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
default-run = "splat"

[workspace]
members = ["crates/assets", "crates/core", "crates/cli"]
default-members = [".", "crates/assets", "crates/core", "crates/cli"]
resolver = "3"

[dependencies]
splat-assets = { path = "crates/assets" }
splat-core = { path = "crates/core" }
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
zeroize = "1"
directories = "6"
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
pulldown-cmark = "0.13"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
base64 = "0.22"
rfd = "0.15"
egui-phosphor = "0.11"
libc = "0.2"
egui_extras = { version = "0.33", default-features = false, features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
rayon = "1.11"
# The source checks read Rust with a real parser (`design::attributes`), never by hand.
syn = { version = "2.0.119", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
egui_kittest = { version = "0.33", features = ["wgpu", "eframe"] }
ab_glyph = "0.2"
epaint_default_fonts = "0.33"

# Test builds only. jemalloc returns freed memory and scales across the visual
# suite's workers; it does not build with MSVC.
[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemallocator = "0.7.0"

# Keep clean project builds small; preserve dependency runtime performance.
[profile.dev]
debug = "line-tables-only"
codegen-units = 16
incremental = false

[profile.dev.package."*"]
opt-level = 2

# Tests only: `cargo build` and `cargo run` keep the app's own code unoptimized for
# debugging. The visual suite runs the app's frames and content work thousands of
# times, and optimized code cut its CPU time by more than half.
[profile.test.package.splat]
opt-level = 2

[profile.test.package.splat-core]
opt-level = 2
