# Calls that a shared part replaces. Each function that still calls one has its own
# `#[allow(clippy::disallowed_methods, reason = "staged: ...")]` (never on a file, a module or
# an `impl`); `design::results::STAGED_ALLOWS` counts them per file and can only shrink.
disallowed-methods = [
    { path = "splat::design::components::ResultOrder::issue", reason = "record the result in a `design::Results` store: it issues the order at the action" },
    { path = "splat::design::components::Footer::result", reason = "give the footer a kept result from a `design::Results` store with `Footer::kept` or `Footer::kept_line`" },
    { path = "splat::design::components::save_row_state", reason = "use `design::save_row` with a `DraftState`" },
    # Package M: the escapes and helpers of `design::outcome`. A named escape stays where a
    # reviewer agreed to it: one suppression on the innermost function, one row in
    # `design::results::STAGED_ALLOWS` (`Ban::Words`, `Ban::Order`, `Ban::Body`).
    { path = "splat::design::outcome::Sentence::outside", reason = "write the words with `sentence!`; words from outside the app (disk, the system, the DM) are a named escape: `Ban::Words`" },
    { path = "splat::design::outcome::Sentence::__formatted", reason = "make sentences with `sentence!`" },
    { path = "splat::design::outcome::Sentence::__literal", reason = "make sentences with `sentence!`" },
    { path = "splat::design::outcome::check_template", reason = "make sentences with `sentence!`" },
    { path = "splat::design::outcome::check_literal", reason = "make sentences with `sentence!`" },
    { path = "splat::design::components::Footer::outcome_at", reason = "record the result in a `design::Results` store and use `Footer::kept_outcome`; a hand-issued order is staged: `Ban::Order`" },
    { path = "splat::design::outcome::banner", reason = "put the notice in the pane's `Footer`; a body place is a review decision: `Ban::Body`" },
    { path = "splat::design::outcome::row_fault", reason = "put the fault in the pane's `Footer`; a body place is a review decision: `Ban::Body`" },
    { path = "splat::design::outcome::PagePlaceholder::show", reason = "a page placeholder is a review decision: `Ban::Body`" },
]
