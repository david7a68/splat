    # a caller cannot add or forget them. A suppression's row in `design::results::STAGED_ALLOWS`
    # is `Ban::Extras(n)`, with the number of these calls its item holds.
    # N3: space comes from a part (a heading adds the space above it, a field the `L` after its
    # help) or from a token (`design::gap(ui, Gap::…)`), never from a raw number. Changing
    # `item_spacing` through `Ui::spacing_mut` is not banned (143 calls, most for a line's layout):
