# Calls that a shared part in `src/design/` replaces (docs/design-system.md). `check` runs Clippy
# with `-D warnings`, so a new call outside its owner fails it. A function that still calls one
# has its own `#[allow(clippy::disallowed_methods, reason = "...")]` on the innermost function,
# for review. The design lint refuses an alias of any path below (`banned-alias`).
disallowed-methods = [
    { path = "splat_design::design::components::ResultOrder::issue", reason = "record the result in a `design::Results` store: it issues the order at the action" },
    { path = "splat_design::design::results::Results::undo", reason = "a footer press names its entry by its ticket: use `Results::undo_by(press.ticket, …)`; by owner, a press could undo a newer result of that owner" },
    { path = "splat_design::design::results::Results::revise", reason = "a revision names its entry by its ticket: use `Results::revise_by(&ticket, …)`; by owner, late work could change a newer result of that owner" },
    { path = "splat_design::design::results::Results::revise_where", reason = "a revision names its entry by its ticket: use `Results::revise_by(&ticket, …)`; a predicate can reach a newer result" },
    { path = "splat_design::design::results::Results::use_press", reason = "a footer press names its entry by its ticket: use `Results::use_press_by(press.ticket)`" },
    { path = "splat_design::design::components::save_row_state", reason = "use `design::save_row` with a `DraftState`" },
    { path = "splat_design::design::layout::Word::checked", reason = "use word!(\"…\")", allow-invalid = true },
    { path = "splat_design::design::layout::FieldName::checked", reason = "use field_id!(\"…\")", allow-invalid = true },
    { path = "splat_design::design::layout::KeyName::checked", reason = "use key!(\"…\")", allow-invalid = true },
    { path = "splat_design::design::outcome::Sentence::outside", reason = "write the words with `sentence!`; words from outside the app (disk, the system, the DM) are a named escape" },
    { path = "splat_design::design::outcome::Sentence::outside_after", reason = "write the words with `sentence!`; outside words after checked lead words are a named escape" },
    { path = "splat_design::design::outcome::Lead::__checked", reason = "make lead words with `lead!`" },
    { path = "splat_design::design::outcome::Sentence::__formatted", reason = "make sentences with `sentence!`" },
    { path = "splat_design::design::outcome::Sentence::__literal", reason = "make sentences with `sentence!`" },
    { path = "splat_design::design::outcome::check_template", reason = "make sentences with `sentence!`" },
    { path = "splat_design::design::outcome::check_literal", reason = "make sentences with `sentence!`" },
    { path = "splat_design::design::outcome::check_choice", reason = "make choice words with `choice!`" },
    { path = "splat_design::design::outcome::ChoiceWords::__template", reason = "make choice words with `choice!`" },
    { path = "splat_design::design::outcome::Messages::answer", reason = "a footer message takes its place from its kind; the one answer to the DM's last act that leads the footer is a review decision (ruling Q-x)" },
    { path = "splat_design::design::outcome::Messages::outcome_at", reason = "record the result in a `design::Results` store, make a `KeptLine` with `Shown::outcome` and use `Messages::kept`" },
]
