# Calls that a shared part in `src/design/` replaces (docs/design-system.md, Widgets). `check` runs
# Clippy with `-D warnings`, so a new call outside its owner fails it. Each function that still
# calls one has its own `#[allow(clippy::disallowed_methods, reason = "staged: ...")]` (never on a
# file, a module, an `impl`, or a function that holds a nested one); `design::results::STAGED_ALLOWS`
# lists each one with the bans it is for (package O: `Ban::Results`; package K: `Ban::Layout`), and
# it can only shrink. Package K's egui paths are the list below, read from egui 0.33.3's API; review
# finds a helper that opens a layer or makes a text field and is not listed, and adds its path. The
# egui paths name a crate only `splat` uses: `allow-invalid` keeps the other workspace crates quiet.
disallowed-methods = [
    # Package O: kept results, the save row.
    { path = "splat::design::components::ResultOrder::issue", reason = "record the result in a `design::Results` store: it issues the order at the action" },
    { path = "splat::design::components::Footer::result", reason = "give the footer a kept result as a `KeptLine` (`Shown::outcome`, `Messages::kept`)" },
    { path = "splat::design::results::Results::undo", reason = "a footer press names its entry by its ticket: use `Results::undo_by(press.ticket, …)`; by owner, a press could undo a newer result of that owner: `Ban::Results`" },
    { path = "splat::design::results::Results::use_press", reason = "a footer press names its entry by its ticket: use `Results::use_press_by(press.ticket)`: `Ban::Results`" },
    { path = "splat::design::components::save_row_state", reason = "use `design::save_row` with a `DraftState`" },
    # Package K: layout parts.
    # Scroll areas: `design::ScrollColumn` keeps the scroll bar's lane, so nothing moves when the bar
    # comes (family F14); `design::sideways_scroll` is the sideways table scroll. These are all of
    # `ScrollArea`'s constructors; it has no `Default`.
    { path = "egui::ScrollArea::vertical", reason = "use design::ScrollColumn, which keeps the scroll bar's lane", allow-invalid = true },
    { path = "egui::ScrollArea::both", reason = "use design::ScrollColumn::sideways_too", allow-invalid = true },
    { path = "egui::ScrollArea::new", reason = "use design::ScrollColumn or design::sideways_scroll", allow-invalid = true },
    { path = "egui::ScrollArea::horizontal", reason = "use design::sideways_scroll", allow-invalid = true },
    { path = "egui::ScrollArea::neither", reason = "use design::ScrollColumn or design::sideways_scroll", allow-invalid = true },
    # Text fields: a field's id comes from a `FieldId`, never from its place in the layout, so a
    # layout branch cannot drop its focus or its cursor (PR 297). These are `TextEdit`'s
    # constructors, its id setters, and the `Ui` helpers that make one.
    { path = "egui::TextEdit::singleline", reason = "use design::line_field, design::labelled_field or FieldId::single_line", allow-invalid = true },
    { path = "egui::TextEdit::multiline", reason = "use FieldId::multi_line or FieldId::editor", allow-invalid = true },
    { path = "egui::TextEdit::id", reason = "a FieldId gives the field its id", allow-invalid = true },
    { path = "egui::TextEdit::id_salt", reason = "a FieldId gives the field its id", allow-invalid = true },
    { path = "egui::TextEdit::id_source", reason = "a FieldId gives the field its id", allow-invalid = true },
    { path = "egui::Ui::text_edit_singleline", reason = "use design::line_field with a FieldId", allow-invalid = true },
    { path = "egui::Ui::text_edit_multiline", reason = "use FieldId::multi_line or FieldId::editor", allow-invalid = true },
    { path = "egui::Ui::code_editor", reason = "use FieldId::multi_line or FieldId::editor", allow-invalid = true },
    { path = "egui::DragValue::new", reason = "a DragValue's text edit takes its id from its place; use design::stepper or design::number_field", allow-invalid = true },
    { path = "egui::DragValue::from_get_set", reason = "a DragValue's text edit takes its id from its place; use design::stepper or design::number_field", allow-invalid = true },
    { path = "egui::Slider::new", reason = "a Slider's value field takes its id from its place", allow-invalid = true },
    { path = "egui::Slider::from_get_set", reason = "a Slider's value field takes its id from its place", allow-invalid = true },
    { path = "splat::design::components::text_field", reason = "use design::labelled_field with a FieldId", allow-invalid = true },
    { path = "splat::design::components::small_text_field", reason = "use design::labelled_field with a FieldId", allow-invalid = true },
    { path = "splat::design::components::text_input", reason = "use design::line_field with a FieldId", allow-invalid = true },
    # Words and field ids are checked when the program compiles: build them with `word!` and
    # `field_id!`, which take a literal and check it in a `const` block.
    { path = "splat::design::layout::Word::checked", reason = "use word!(\"…\")", allow-invalid = true },
    { path = "splat::design::layout::FieldName::checked", reason = "use field_id!(\"…\")", allow-invalid = true },
    # The image viewer says its size, known or not (package K2).
    # Row keys that take any number or text: each use is a counted row a reviewer reads.
    { path = "splat::design::layout::RowIndex::from_data", reason = "a row key from the row's data: one row in design::results::STAGED_ALLOWS (Ban::RowKey)", allow-invalid = true },
    { path = "splat::design::layout::TextKey::from_data", reason = "a row key from the row's data: one row in design::results::STAGED_ALLOWS (Ban::RowKey)", allow-invalid = true },
