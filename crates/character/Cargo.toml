[package]
name = "splat-character"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
splat-content = { path = "../content" }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
pulldown-cmark = "0.13"
splat-execution = { path = "../execution" }
