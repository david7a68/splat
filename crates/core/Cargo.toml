[package]
name = "splat-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
directories = "6"
include_dir = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pulldown-cmark = "0.13"
rayon = "1.11"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
splat-assets = { path = "../assets" }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
